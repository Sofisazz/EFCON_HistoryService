server:
  port: 8088

spring:
  application:
    name: history-service
  datasource:
    url: jdbc:postgresql://localhost:5434/history_service
    username: postgres
    password: 1234
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  liquibase:
    change-log: classpath:db/changelog/db.changelog-1.yaml
    enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:9090/eureka/
  instance:
    prefer-ip-address: true